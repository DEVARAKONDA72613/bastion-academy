# Bastion Academy API — Render Blueprint
# API only: intentionally does not create or modify a PostgreSQL database.
# During setup, set DATABASE_URL to the intended existing development/test database.
# Do not use production data until the target database and backup are confirmed.

services:
  - type: web
    name: bastion-academy-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: mock
      - key: TRANSLATION_PROVIDER
        value: mock
